name: Build and Deploy Python

on:
  workflow_call:
    inputs:
      kubernetesLabel:
        required: true
        type: string
      kubernetesYaml:
        required: true
        type: string
      gitProjectKey:
        required: true
        type: string
      gitRepositoryName:
        required: true
        type: string
      emailOnFailure:
        required: true
        type: string
      projectSealId:
        required: true
        type: string
      isRunSonarQube:
        required: false
        type: boolean
        default: false
      isRunSsapScan:
        required: false
        type: boolean
        default: false
      isRunSiCScan:
        required: false
        type: boolean
        default: false
      isRunImageScan:
        required: false
        type: boolean
        default: false
      isZipArchive:
        required: false
        type: boolean
        default: false
      revision:
        required: false
        type: string
        default: "latest"
      pytestFolder:
        required: false
        type: string
        default: "tests"
      useCoverageTool:
        required: false
        type: boolean
        default: false
      coverageToolSourceDir:
        required: false
        type: string
        default: ""
      useUv:
        required: false
        type: boolean
        default: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print parameters
        run: |
          echo "Kubernetes Label: ${{ inputs.kubernetesLabel }}"
          echo "Kubernetes YAML: ${{ inputs.kubernetesYaml }}"
          echo "Git Project Key: ${{ inputs.gitProjectKey }}"
          echo "Git Repository Name: ${{ inputs.gitRepositoryName }}"
          echo "Email On Failure: ${{ inputs.emailOnFailure }}"
          echo "Project Seal ID: ${{ inputs.projectSealId }}"
          echo "Revision: ${{ inputs.revision }}"
          echo "Pytest Folder: ${{ inputs.pytestFolder }}"
          echo "Use Coverage Tool: ${{ inputs.useCoverageTool }}"
          echo "Coverage Tool Source Dir: ${{ inputs.coverageToolSourceDir }}"
          echo "Use Uv: ${{ inputs.useUv }}"

      - name: Setup Environment and determine version
        id: setup_env
        uses: ./.github/actions/setup-env
        with:
          artifact_name: ${{ github.event.repository.name }}
          default_revision: "0.1.0"
          use_git_commit_for_version: "false"

      - name: Lint and Test
        id: lint_test
        uses: ./.github/actions/lint-and-test
        with:
          use_uv: "false"
          pytest_folder: "tests"
          pytest_threshold: ${{ steps.setup_env.outputs.pytest_threshold }}

      - name: Publish to PyPI (if enabled)
        if: ${{ steps.setup_env.outputs.pypi_upload == 'true' && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/publish-pypi
        with:
          artifact: ${{ steps.setup_env.outputs.artifact }}
          version: ${{ steps.setup_env.outputs.version }}
          repo_url: ${{ inputs.pypi_repo || 'https://artifactory.dyn.prd.aws.jpmchase.net/artifactory' }}
          username: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}

      - name: Build & Publish Docker (if enabled)
        if: ${{ steps.setup_env.outputs.has_dockerfile == 'true' }}
        uses: ./.github/actions/publish-docker
        with:
          artifact: ${{ steps.setup_env.outputs.artifact }}
          version: ${{ steps.setup_env.outputs.version }}
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish Helm charts (if present)
        if: ${{ steps.setup_env.outputs.has_helm_charts == 'true' }}
        uses: ./.github/actions/publish-helm
        with:
          chart_dir: "helm-chart"
          version: ${{ steps.setup_env.outputs.version }}
          helm_repo_url: ${{ secrets.HELM_REPO_URL }}
          helm_repo_user: ${{ secrets.HELM_REPO_USER }}
          helm_repo_pass: ${{ secrets.HELM_REPO_PASS }}

      - name: Run SonarQube scan (PRs targeting main)
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/scan-sonar
        with:
          project_key: ${{ steps.setup_env.outputs.sonar_project_key }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}

      - name: Trigger deployment webhook(s)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/jet-events
        with:
          artifact: ${{ steps.setup_env.outputs.artifact }}
          version: ${{ steps.setup_env.outputs.version }}
          spinnaker_webhook: ${{ secrets.SPINNAKER_WEBHOOK_URL }}
          harness_token: ${{ secrets.HARNESS_TOKEN }}

