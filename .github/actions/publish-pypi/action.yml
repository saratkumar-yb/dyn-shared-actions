name: Publish PyPI
description: Build and publish Python package to Artifactory/PyPI via twine.

inputs:
  artifact:
    required: true
  version:
    required: true
  repo_url:
    required: true
  username:
    required: true
  password:
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build and twine
      run: |
        python -m pip install --upgrade pip build twine

    - name: Build package
      run: |
        python -m build || true

    - name: Upload via twine
      env:
        TWINE_USERNAME: ${{ inputs.username }}
        TWINE_PASSWORD: ${{ inputs.password }}
      run: |
        # twine will use env TWINE_USERNAME/TWINE_PASSWORD
        python -m twine upload --repository-url "${{ inputs.repo_url }}" dist/*
