name: Lint and Test
description: Runs linters, pytest (unit + functional) and coverage; converts behave to cucumber if present.

inputs:
  use_uv:
    required: false
    default: "false"
  pytest_folder:
    required: false
    default: "tests"
  pytest_threshold:
    required: false
    default: "70"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install tooling
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.use_uv }}" = "true" ]; then
          pip install uv
          uv --native-tls sync --all-extras || true
          uv --native-tls run -m ruff check || true
        else
          pip install pipenv
          if [ -f Pipfile ]; then
            pipenv requirements --dev > requirements.txt || true
          fi
        fi
        pip install pytest pytest-cov behave behave2cucumber flake8 isort black mypy || true

    - name: Run pytest with coverage
      shell: bash
      run: |
        set -euo pipefail
        PYTEST_DIR="${{ inputs.pytest_folder }}"
        COVERAGE_XML="coverage.xml"
        pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml:${COVERAGE_XML} ${PYTEST_DIR} || exit $?

    - name: Check coverage threshold
      shell: bash
      run: |
        THRESH=${{ inputs.pytest_threshold }}
        # parse coverage percent from coverage.xml (line-rate * 100)
        if [ -f coverage.xml ]; then
          LINE_RATE=$(python - <<'PY'
import xml.etree.ElementTree as ET
t=ET.parse('coverage.xml')
root=t.getroot()
rate=root.attrib.get('line-rate') or (next((e.attrib.get('line-rate') for e in root.iter() if 'line-rate' in e.attrib), None))
print(rate or "0")
PY
)
          # convert to int percentage if possible
          if [ -z "${LINE_RATE}" ] || [ "${LINE_RATE}" = "None" ]; then
            echo "Cannot determine coverage line-rate; skipping threshold check."
          else
            PCT=$(awk "BEGIN { printf("%d", ${LINE_RATE} * 100) }")
            echo "Coverage percent: ${PCT}%"
            if [ "${PCT}" -lt "${THRESH}" ]; then
              echo "Coverage ${PCT}% is below threshold ${THRESH}%"; exit 1
            fi
          fi
        else
          echo "coverage.xml not found; skipping threshold check."
        fi

    - name: Convert behave to cucumber (if any)
      shell: bash
      run: |
        if [ -f reports.json ]; then
          pip install behave2cucumber
          python - <<'PY'
import json,sys
from behave2cucumber import convert
with open('reports.json') as f:
    data=json.load(f)
with open('cucumber_report.json', 'w') as out:
    out.write(json.dumps(convert(data)))
print('Converted behave -> cucumber: cucumber_report.json')
PY
        fi
