name: JET & Deployment Events
description: Send JET events and trigger Spinnaker/Harness where configured.

inputs:
  artifact:
    required: true
  version:
    required: true
  spinnaker_webhook:
    required: false
  harness_token:
    required: false

runs:
  using: "composite"
  steps:
    - name: Send JET build event (placeholder)
      shell: bash
      run: |
        echo "Submitting JET build event for ${{ inputs.artifact }}:${{ inputs.version }}"
        # implement internal JET API call here

    - name: Trigger Spinnaker webhook (if provided)
      if: ${{ inputs.spinnaker_webhook != '' }}
      shell: bash
      run: |
        echo "Triggering Spinnaker webhook"
        curl -s -X POST -H 'Content-Type: application/json' -d "{"artifact":"${{ inputs.artifact }}","version":"${{ inputs.version }}"}" "${{ inputs.spinnaker_webhook }}" || true

    - name: Trigger Harness (placeholder)
      if: ${{ inputs.harness_token != '' }}
      shell: bash
      run: |
        echo "Triggering Harness pipeline (placeholder)"
