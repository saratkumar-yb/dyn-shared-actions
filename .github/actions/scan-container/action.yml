name: Container Image Scan
description: Run container image scanner (placeholder for Trivy/Snyk).

inputs:
  image:
    required: true

runs:
  using: "composite"
  steps:
    - name: Install trivy
      run: |
        curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.43.0 || true

    - name: Scan image
      shell: bash
      run: |
        trivy image --severity HIGH,CRITICAL --exit-code 1 "${{ inputs.image }}" || echo "trivy scan failed or found issues"
